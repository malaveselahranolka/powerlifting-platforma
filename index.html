<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platforma — trenérský nástroj pro powerlifting</title>
  <meta name="description" content="E1RM kalkulačka, RPE tabulka, analýza tréninkového bloku, model únavy a formy, nakládání osy a plán závodního dne. Pro powerliftery a jejich trenéry.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="css/app.css">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c31f2a'/%3E%3Crect x='3' y='13' width='26' height='6' rx='3' fill='%23fff'/%3E%3Crect x='6' y='9' width='4' height='14' rx='2' fill='%23fff'/%3E%3Crect x='22' y='9' width='4' height='14' rx='2' fill='%23fff'/%3E%3C/svg%3E">

  <script>
    // Motiv se musí nasadit dřív, než se vykreslí první pixel — jinak
    // v tmavém režimu problikne bílá stránka.
    try {
      const t = localStorage.getItem('pwr.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch { /* zakázané úložiště — jede se podle nastavení systému */ }
  </script>
</head>
<body>
  <div class="app" id="app"></div>
  <noscript>
    <p style="padding:32px">Aplikace počítá všechno v prohlížeči. Zapni JavaScript.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
